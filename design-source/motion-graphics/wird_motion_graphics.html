<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Wird — Premium Motion Graphics Promo Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:ital,wght@0,400;0,700;1,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&family=Playfair+Display:ital,wght@0,600;0,700;1,600&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-dark: #070D0A;
      --bg-emerald: #0A1C14;
      --surface-emerald: #122B20;
      --surface-card: #18382A;
      --gold-primary: #D4AF37;
      --gold-bright: #F5E08C;
      --gold-glow: rgba(212, 175, 55, 0.4);
      --emerald-glow: rgba(46, 204, 113, 0.25);
      --text-white: #FFFFFF;
      --text-sub: #A3C2B1;
      --text-muted: #6E8F7E;
      --clay-shadow-out: 8px 12px 24px rgba(0,0,0,0.45);
      --clay-shadow-in: inset 2px 2px 4px rgba(255,255,255,0.12), inset -2px -2px 4px rgba(0,0,0,0.4);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
    }

    body {
      background: #040806;
      color: #E2ECE6;
      font-family: 'Plus Jakarta Sans', -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
      padding: 16px;
    }

    /* Studio Header */
    .studio-header {
      width: 100%;
      max-width: 1200px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
      padding: 8px 16px;
      background: rgba(18, 43, 32, 0.5);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 12px;
    }

    .studio-logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.3px;
    }

    .studio-logo svg {
      width: 22px;
      height: 22px;
    }

    .studio-pill {
      font-size: 11px;
      font-weight: 700;
      padding: 3px 8px;
      border-radius: 100px;
      background: rgba(212, 175, 55, 0.15);
      color: var(--gold-bright);
      border: 1px solid rgba(212, 175, 55, 0.3);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .studio-controls-top {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .aspect-toggle {
      display: flex;
      background: rgba(7, 13, 10, 0.8);
      border-radius: 8px;
      padding: 2px;
      border: 1px solid rgba(255,255,255,0.08);
    }

    .aspect-btn {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 12px;
      font-weight: 600;
      padding: 6px 12px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .aspect-btn.active {
      background: var(--surface-emerald);
      color: var(--gold-bright);
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    /* Video Stage Viewport */
    .viewport-outer {
      position: relative;
      background: #000;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(212, 175, 55, 0.2);
      border-radius: 20px;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: width 0.3s cubic-bezier(0.16, 1, 0.3, 1), height 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    /* Default: 9:16 Vertical aspect ratio (540x960 scaled down from 1080x1920) */
    .viewport-outer.vertical {
      width: 450px;
      height: 800px;
    }

    /* 16:9 Landscape aspect ratio (960x540 scaled down from 1920x1080) */
    .viewport-outer.horizontal {
      width: 960px;
      height: 540px;
    }

    #videoCanvas {
      width: 100%;
      height: 100%;
      display: block;
      background: #070D0A;
    }

    /* Studio Bottom Controls */
    .studio-bottom-bar {
      width: 100%;
      max-width: 1200px;
      background: rgba(18, 43, 32, 0.6);
      backdrop-filter: blur(16px);
      border: 1px solid rgba(212, 175, 55, 0.2);
      border-radius: 16px;
      padding: 14px 20px;
      margin-top: 14px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* Timeline Scrubber */
    .timeline-row {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .time-readout {
      font-family: 'Courier New', monospace;
      font-size: 13px;
      font-weight: 700;
      color: var(--gold-bright);
      min-width: 90px;
      letter-spacing: 0.5px;
    }

    .scrubber-track {
      flex: 1;
      height: 8px;
      background: rgba(255,255,255,0.08);
      border-radius: 4px;
      position: relative;
      cursor: pointer;
      overflow: hidden;
    }

    .scrubber-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #10B981, var(--gold-primary));
      border-radius: 4px;
      box-shadow: 0 0 10px var(--gold-glow);
    }

    .scrubber-markers {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      display: flex;
      pointer-events: none;
    }

    .scene-marker {
      position: absolute;
      width: 2px;
      height: 100%;
      background: rgba(255,255,255,0.3);
    }

    /* Action Buttons Row */
    .actions-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    .playback-controls {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-icon {
      background: var(--surface-emerald);
      border: 1px solid rgba(255,255,255,0.12);
      color: #fff;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      background: var(--surface-card);
      border-color: var(--gold-primary);
      transform: translateY(-1px);
    }

    .btn-icon.play-btn {
      background: linear-gradient(135deg, var(--gold-primary), #B89020);
      color: #070D0A;
      width: 46px;
      height: 46px;
      border-radius: 12px;
      box-shadow: 0 4px 14px rgba(212, 175, 55, 0.4);
    }

    .btn-icon.play-btn:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(212, 175, 55, 0.6);
    }

    .scene-jump-group {
      display: flex;
      gap: 6px;
      background: rgba(7, 13, 10, 0.6);
      padding: 4px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.06);
    }

    .scene-pill {
      background: none;
      border: none;
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 700;
      padding: 5px 10px;
      border-radius: 6px;
      cursor: pointer;
      transition: all 0.15s;
    }

    .scene-pill:hover {
      color: #fff;
      background: rgba(255,255,255,0.05);
    }

    .scene-pill.active {
      background: var(--surface-emerald);
      color: var(--gold-bright);
      border: 1px solid rgba(212, 175, 55, 0.3);
    }

    .export-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .btn-export {
      background: linear-gradient(135deg, #10B981, #059669);
      color: #FFFFFF;
      border: none;
      font-size: 13px;
      font-weight: 700;
      padding: 10px 18px;
      border-radius: 10px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(16, 185, 129, 0.35);
      transition: all 0.2s;
    }

    .btn-export:hover {
      background: linear-gradient(135deg, #059669, #047857);
      transform: translateY(-1px);
      box-shadow: 0 6px 20px rgba(16, 185, 129, 0.5);
    }

    .btn-export.recording {
      background: #EF4444;
      animation: pulseRecord 1.2s infinite;
      box-shadow: 0 4px 14px rgba(239, 68, 68, 0.5);
    }

    @keyframes pulseRecord {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }

    /* Sound indicator */
    .audio-btn.muted svg {
      opacity: 0.4;
    }
  </style>
</head>
<body>

  <!-- Studio Top Navigation -->
  <header class="studio-header">
    <div class="studio-logo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--gold-primary)">
        <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
      </svg>
      <span>Wird Motion Graphics Studio</span>
      <span class="studio-pill">60 FPS Commercial</span>
    </div>

    <div class="studio-controls-top">
      <div class="aspect-toggle">
        <button class="aspect-btn active" id="btnAspectVertical" title="9:16 Vertical for Reels, TikTok, Shorts, WhatsApp Status">9:16 Vertical</button>
        <button class="aspect-btn" id="btnAspectHorizontal" title="16:9 Landscape for YouTube, Twitter/X, Website Hero">16:9 Landscape</button>
      </div>

      <button class="btn-icon audio-btn" id="btnAudioToggle" title="Toggle Sound Design Synthesizer">
        <svg id="audioIcon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
          <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
        </svg>
      </button>
    </div>
  </header>

  <!-- Video Viewport -->
  <main class="viewport-outer vertical" id="viewportOuter">
    <canvas id="videoCanvas" width="1080" height="1920"></canvas>
  </main>

  <!-- Studio Bottom Playback Bar -->
  <footer class="studio-bottom-bar">
    <div class="timeline-row">
      <div class="time-readout" id="timecodeDisplay">00:00.00</div>
      <div class="scrubber-track" id="scrubberTrack">
        <div class="scrubber-fill" id="scrubberFill"></div>
        <div class="scrubber-markers">
          <div class="scene-marker" style="left: 12.5%;"></div>  <!-- Scene 2: 3.5s -->
          <div class="scene-marker" style="left: 28.5%;"></div>  <!-- Scene 3: 8.0s -->
          <div class="scene-marker" style="left: 46.4%;"></div>  <!-- Scene 4: 13.0s -->
          <div class="scene-marker" style="left: 64.2%;"></div>  <!-- Scene 5: 18.0s -->
          <div class="scene-marker" style="left: 82.1%;"></div>  <!-- Scene 6: 23.0s -->
        </div>
      </div>
      <div class="time-readout" style="text-align: right; color: var(--text-muted);">00:28.00</div>
    </div>

    <div class="actions-row">
      <div class="playback-controls">
        <button class="btn-icon" id="btnRestart" title="Restart from 0:00">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="19 20 9 12 19 4 19 20"></polygon>
            <line x1="5" y1="19" x2="5" y2="5"></line>
          </svg>
        </button>

        <button class="btn-icon play-btn" id="btnPlayPause" title="Play / Pause">
          <svg id="playIcon" width="20" height="20" viewBox="0 0 24 24" fill="currentColor">
            <polygon points="5 3 19 12 5 21 5 3"></polygon>
          </svg>
        </button>

        <button class="btn-icon" id="btnLoopToggle" title="Loop Playback">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="17 1 21 5 17 9"></polyline>
            <path d="M3 11V9a4 4 0 0 1 4-4h14"></path>
            <polyline points="7 23 3 19 7 15"></polyline>
            <path d="M21 13v2a4 4 0 0 1-4 4H3"></path>
          </svg>
        </button>
      </div>

      <!-- Quick Scene Jumper -->
      <div class="scene-jump-group">
        <button class="scene-pill active" data-scene="1">1. Hook</button>
        <button class="scene-pill" data-scene="2">2. Meet Wird</button>
        <button class="scene-pill" data-scene="3">3. Real Life</button>
        <button class="scene-pill" data-scene="4">4. Whisper AI</button>
        <button class="scene-pill" data-scene="5">5. AI Chat</button>
        <button class="scene-pill" data-scene="6">6. Call to Action</button>
      </div>

      <!-- Video Export Button -->
      <div class="export-group">
        <button class="btn-export" id="btnExport">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
            <polyline points="7 10 12 15 17 10"></polyline>
            <line x1="12" y1="15" x2="12" y2="3"></line>
          </svg>
          <span id="exportText">Export 60fps Video</span>
        </button>
      </div>
    </div>
  </footer>

  <!-- Motion Graphics Engine Script -->
  <script>
    /**
     * WIRD PREMIUM MOTION GRAPHICS ENGINE
     * Renders a 60fps high-impact promotional commercial directly to HTML5 Canvas.
     * Features:
     * - Kinetic Typography with spring physics
     * - 3D Isometric Smartphone Rig with lighting highlights
     * - Real authentic Wird UI screens (Atmospheric Mosque, Daily Wird, Sūrahs, Whisper AI)
     * - Procedural Particle & Islamic Rosette geometry
     * - Web Audio Procedural Synthesizer for cinematic sound FX
     * - Live Canvas MediaRecorder export to MP4/WebM
     */

    const canvas = document.getElementById('videoCanvas');
    const ctx = canvas.getContext('2d', { alpha: false });
    const viewportOuter = document.getElementById('viewportOuter');

    // UI Elements
    const btnPlayPause = document.getElementById('btnPlayPause');
    const playIcon = document.getElementById('playIcon');
    const btnRestart = document.getElementById('btnRestart');
    const btnLoopToggle = document.getElementById('btnLoopToggle');
    const timecodeDisplay = document.getElementById('timecodeDisplay');
    const scrubberTrack = document.getElementById('scrubberTrack');
    const scrubberFill = document.getElementById('scrubberFill');
    const scenePills = document.querySelectorAll('.scene-pill');
    const btnAspectVertical = document.getElementById('btnAspectVertical');
    const btnAspectHorizontal = document.getElementById('btnAspectHorizontal');
    const btnAudioToggle = document.getElementById('btnAudioToggle');
    const btnExport = document.getElementById('btnExport');
    const exportText = document.getElementById('exportText');

    // State
    const TOTAL_DURATION_SEC = 28.0;
    let isPlaying = true;
    let isLooping = true;
    let currentTime = 0; // in seconds
    let lastTimestamp = 0;
    let isVertical = true;
    let audioEnabled = true;
    let isRecording = false;
    let mediaRecorder = null;
    let recordedChunks = [];

    // Scene timestamps (in seconds)
    const SCENES = [
      { id: 1, name: "The Hook", start: 0.0, end: 3.5 },
      { id: 2, name: "Meet Wird", start: 3.5, end: 8.0 },
      { id: 3, name: "Designed for Real Life", start: 8.0, end: 13.0 },
      { id: 4, name: "Offline Whisper AI", start: 13.0, end: 18.0 },
      { id: 5, name: "AI Companion", start: 18.0, end: 23.0 },
      { id: 6, name: "Rebuilt for Life", start: 23.0, end: 28.0 }
    ];

    // Background floating dust particles
    const PARTICLES = Array.from({ length: 45 }, () => ({
      x: Math.random(),
      y: Math.random(),
      size: Math.random() * 2.5 + 1.0,
      alpha: Math.random() * 0.4 + 0.15,
      speedX: (Math.random() - 0.5) * 0.02,
      speedY: -Math.random() * 0.04 - 0.01,
      twinkle: Math.random() * Math.PI * 2
    }));

    // Web Audio Synthesizer for procedural Sound FX
    let audioCtx = null;
    function initAudio() {
      if (!audioCtx) {
        audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSoundCue(type) {
      if (!audioEnabled) return;
      initAudio();
      if (!audioCtx) return;

      const now = audioCtx.currentTime;

      if (type === 'sub_drop') {
        // Deep cinematic sub-bass boom (80Hz down to 30Hz)
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(90, now);
        osc.frequency.exponentialRampToValueAtTime(28, now + 1.2);
        gain.gain.setValueAtTime(0.4, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 1.2);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 1.3);
      } else if (type === 'whoosh') {
        // Filtered noise whoosh transition
        const bufferSize = audioCtx.sampleRate * 0.4;
        const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferSize; i++) {
          data[i] = Math.random() * 2 - 1;
        }
        const noise = audioCtx.createBufferSource();
        noise.buffer = buffer;
        const filter = audioCtx.createBiquadFilter();
        filter.type = 'bandpass';
        filter.frequency.setValueAtTime(300, now);
        filter.frequency.exponentialRampToValueAtTime(1400, now + 0.2);
        filter.frequency.exponentialRampToValueAtTime(400, now + 0.4);
        const gain = audioCtx.createGain();
        gain.gain.setValueAtTime(0.01, now);
        gain.gain.linearRampToValueAtTime(0.25, now + 0.2);
        gain.gain.linearRampToValueAtTime(0.001, now + 0.4);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        noise.start(now);
      } else if (type === 'pop') {
        // Subtle tactile UI click
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(360, now);
        osc.frequency.exponentialRampToValueAtTime(120, now + 0.08);
        gain.gain.setValueAtTime(0.2, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.09);
      } else if (type === 'chime') {
        // Resonant golden harmonic chime (Islamic rosette reveal)
        [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(freq, now + i * 0.06);
          gain.gain.setValueAtTime(0.12, now + i * 0.06);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.06 + 2.0);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now + i * 0.06);
          osc.stop(now + i * 0.06 + 2.1);
        });
      }
    }

    let lastSoundScene = 0;
    function checkAudioTriggers(t) {
      const currentScene = SCENES.find(s => t >= s.start && t < s.end);
      if (currentScene && currentScene.id !== lastSoundScene) {
        lastSoundScene = currentScene.id;
        if (currentScene.id === 1) playSoundCue('sub_drop');
        else if (currentScene.id === 2) { playSoundCue('whoosh'); setTimeout(() => playSoundCue('chime'), 400); }
        else if (currentScene.id === 3) playSoundCue('whoosh');
        else if (currentScene.id === 4) { playSoundCue('pop'); playSoundCue('whoosh'); }
        else if (currentScene.id === 5) playSoundCue('pop');
        else if (currentScene.id === 6) { playSoundCue('chime'); playSoundCue('sub_drop'); }
      }
    }

    // Easing Functions
    function easeOutCubic(x) {
      return 1 - Math.pow(1 - x, 3);
    }

    function easeInOutCubic(x) {
      return x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
    }

    function spring(t) {
      // Damped harmonic oscillation for natural punchy spring
      const c4 = (2 * Math.PI) / 3;
      return t === 0 ? 0 : t === 1 ? 1 : Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
    }

    // DRAWING HELPERS

    // 8-Point Islamic Rosette
    function drawIslamicRosette(ctx, cx, cy, radius, strokeColor, fillColor = null, rotation = 0) {
      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(rotation);

      ctx.beginPath();
      const points = 16;
      for (let i = 0; i <= points; i++) {
        const angle = (i * Math.PI) / 8;
        const r = i % 2 === 0 ? radius : radius * 0.72;
        const x = Math.cos(angle) * r;
        const y = Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();

      if (fillColor) {
        ctx.fillStyle = fillColor;
        ctx.fill();
      }
      if (strokeColor) {
        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = 2.5;
        ctx.stroke();
      }

      // Inner star ring
      ctx.beginPath();
      for (let i = 0; i <= points; i++) {
        const angle = (i * Math.PI) / 8 + Math.PI / 16;
        const r = i % 2 === 0 ? radius * 0.45 : radius * 0.32;
        const x = Math.cos(angle) * r;
        const y = Math.sin(angle) * r;
        if (i === 0) ctx.moveTo(x, y);
        else ctx.lineTo(x, y);
      }
      ctx.closePath();
      if (strokeColor) {
        ctx.strokeStyle = strokeColor;
        ctx.lineWidth = 1.5;
        ctx.stroke();
      }

      ctx.restore();
    }

    // Rounded rectangle helper
    function roundRect(ctx, x, y, width, height, radius) {
      ctx.beginPath();
      ctx.moveTo(x + radius, y);
      ctx.lineTo(x + width - radius, y);
      ctx.arcTo(x + width, y, x + width, y + radius, radius);
      ctx.lineTo(x + width, y + height - radius);
      ctx.arcTo(x + width, y + height, x + width - radius, y + height, radius);
      ctx.lineTo(x + radius, y + height);
      ctx.arcTo(x, y + height, x, y + height - radius, radius);
      ctx.lineTo(x, y + radius);
      ctx.arcTo(x, y, x + radius, y, radius);
      ctx.closePath();
    }

    // 3D Isometric Smartphone Rig
    function draw3DPhone(ctx, cx, cy, scale, rotX, rotY, rotZ, screenContentRenderer, options = {}) {
      ctx.save();
      ctx.translate(cx, cy);

      const phoneW = 380 * scale;
      const phoneH = 780 * scale;
      const cornerRadius = 46 * scale;

      // 3D transformation matrix approximation
      const skewY = Math.tan(rotY) * 0.4;
      const skewX = Math.tan(rotX) * 0.2;
      const perspectiveScaleX = Math.cos(rotY);
      const perspectiveScaleY = Math.cos(rotX);

      ctx.transform(perspectiveScaleX, skewY, skewX, perspectiveScaleY, 0, 0);
      ctx.rotate(rotZ);

      // Multi-layer clay drop shadow
      ctx.shadowColor = 'rgba(0, 0, 0, 0.65)';
      ctx.shadowBlur = 45 * scale;
      ctx.shadowOffsetX = 18 * scale * Math.cos(rotY + 0.5);
      ctx.shadowOffsetY = 32 * scale;

      // Outer phone chassis (Titanium Dark Emerald)
      roundRect(ctx, -phoneW/2, -phoneH/2, phoneW, phoneH, cornerRadius);
      const chassisGrad = ctx.createLinearGradient(-phoneW/2, -phoneH/2, phoneW/2, phoneH/2);
      chassisGrad.addColorStop(0, '#1E3E2F');
      chassisGrad.addColorStop(0.5, '#0E2219');
      chassisGrad.addColorStop(1, '#07130D');
      ctx.fillStyle = chassisGrad;
      ctx.fill();

      // Reset shadow for phone body details
      ctx.shadowColor = 'transparent';
      ctx.shadowBlur = 0;
      ctx.shadowOffsetX = 0;
      ctx.shadowOffsetY = 0;

      // Golden chamfered bezel edge
      ctx.strokeStyle = 'rgba(212, 175, 55, 0.45)';
      ctx.lineWidth = 2.5 * scale;
      ctx.stroke();

      // Inner bezel
      const innerBezelInset = 8 * scale;
      roundRect(ctx, -phoneW/2 + innerBezelInset, -phoneH/2 + innerBezelInset, phoneW - innerBezelInset*2, phoneH - innerBezelInset*2, cornerRadius - 6*scale);
      ctx.fillStyle = '#060B08';
      ctx.fill();
      ctx.strokeStyle = 'rgba(255, 255, 255, 0.08)';
      ctx.lineWidth = 1 * scale;
      ctx.stroke();

      // Phone Screen Display (OLED Panel)
      const screenInset = 12 * scale;
      const screenW = phoneW - screenInset*2;
      const screenH = phoneH - screenInset*2;
      const screenR = cornerRadius - 8*scale;

      ctx.save();
      roundRect(ctx, -phoneW/2 + screenInset, -phoneH/2 + screenInset, screenW, screenH, screenR);
      ctx.clip();

      // Render custom screen contents
      if (screenContentRenderer) {
        screenContentRenderer(ctx, -phoneW/2 + screenInset, -phoneH/2 + screenInset, screenW, screenH, scale);
      }

      // Glass specular reflection highlight (sweeps across glass as phone rotates)
      const reflectionGrad = ctx.createLinearGradient(
        -phoneW + (rotY * 400 * scale), -phoneH,
        phoneW + (rotY * 400 * scale), phoneH
      );
      reflectionGrad.addColorStop(0, 'rgba(255, 255, 255, 0.0)');
      reflectionGrad.addColorStop(0.45, 'rgba(255, 255, 255, 0.04)');
      reflectionGrad.addColorStop(0.5, 'rgba(255, 255, 255, 0.16)');
      reflectionGrad.addColorStop(0.55, 'rgba(255, 255, 255, 0.04)');
      reflectionGrad.addColorStop(1, 'rgba(255, 255, 255, 0.0)');

      ctx.fillStyle = reflectionGrad;
      ctx.fillRect(-phoneW/2 + screenInset, -phoneH/2 + screenInset, screenW, screenH);

      // Camera cutout pill (Dynamic Island style)
      ctx.fillStyle = '#020403';
      roundRect(ctx, -42 * scale, -phoneH/2 + 22 * scale, 84 * scale, 22 * scale, 11 * scale);
      ctx.fill();
      ctx.strokeStyle = 'rgba(255,255,255,0.06)';
      ctx.lineWidth = 1;
      ctx.stroke();

      ctx.restore(); // end screen clip

      ctx.restore(); // end phone transform
    }

    // MAIN RENDER LOOP (Timeline-driven)
    function render(timestamp) {
      if (!lastTimestamp) lastTimestamp = timestamp;
      const delta = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;

      if (isPlaying) {
        currentTime += delta;
        if (currentTime >= TOTAL_DURATION_SEC) {
          if (isLooping) {
            currentTime = 0;
            lastSoundScene = 0;
          } else {
            currentTime = TOTAL_DURATION_SEC;
            isPlaying = false;
            updatePlayIcon();
          }
        }
      }

      checkAudioTriggers(currentTime);
      updateUI();

      // Canvas dimensions
      const W = canvas.width;
      const H = canvas.height;

      // Clear Canvas with Obsidian Background
      ctx.fillStyle = '#060D09';
      ctx.fillRect(0, 0, W, H);

      // Draw Volumetric Radial Background Glow
      const bgGrad = ctx.createRadialGradient(W/2, H/2, 50, W/2, H/2, W * 0.85);
      bgGrad.addColorStop(0, '#0F2B1E');
      bgGrad.addColorStop(0.5, '#071610');
      bgGrad.addColorStop(1, '#030805');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, W, H);

      // Render Floating Dust Particles
      PARTICLES.forEach(p => {
        p.y += p.speedY;
        p.x += p.speedX;
        if (p.y < 0) p.y = 1;
        if (p.x < 0) p.x = 1;
        if (p.x > 1) p.x = 0;

        const px = p.x * W;
        const py = p.y * H;
        const twinkleAlpha = p.alpha * (0.6 + 0.4 * Math.sin(currentTime * 3 + p.twinkle));

        ctx.fillStyle = `rgba(245, 224, 140, ${twinkleAlpha})`;
        ctx.beginPath();
        ctx.arc(px, py, p.size, 0, Math.PI * 2);
        ctx.fill();
      });

      // RENDER SCENES BASED ON TIMECODE
      const t = currentTime;

      // SCENE 1: THE FRICTION (0.0s - 3.5s)
      if (t >= 0.0 && t < 3.5) {
        renderScene1(ctx, W, H, t);
      }
      // SCENE 2: MEET WIRD / THE REVEAL (3.5s - 8.0s)
      else if (t >= 3.5 && t < 8.0) {
        renderScene2(ctx, W, H, t - 3.5);
      }
      // SCENE 3: DESIGNED FOR REAL LIFE (8.0s - 13.0s)
      else if (t >= 8.0 && t < 13.0) {
        renderScene3(ctx, W, H, t - 8.0);
      }
      // SCENE 4: 100% OFFLINE WHISPER AI (13.0s - 18.0s)
      else if (t >= 13.0 && t < 18.0) {
        renderScene4(ctx, W, H, t - 13.0);
      }
      // SCENE 5: AI COMPANION (18.0s - 23.0s)
      else if (t >= 18.0 && t < 23.0) {
        renderScene5(ctx, W, H, t - 18.0);
      }
      // SCENE 6: THE OUTRO / CALL TO ACTION (23.0s - 28.0s)
      else if (t >= 23.0) {
        renderScene6(ctx, W, H, t - 23.0);
      }

      requestAnimationFrame(render);
    }

    // SCENE 1: The Friction / The Hook
    function renderScene1(ctx, W, H, st) {
      const enterProgress = Math.min(st / 0.8, 1);
      const ease = easeOutCubic(enterProgress);

      // Subtle tension vignette
      const redVignette = ctx.createRadialGradient(W/2, H/2, W*0.3, W/2, H/2, W*0.9);
      redVignette.addColorStop(0, 'rgba(0,0,0,0)');
      redVignette.addColorStop(1, 'rgba(180, 40, 30, 0.15)');
      ctx.fillStyle = redVignette;
      ctx.fillRect(0, 0, W, H);

      // Faint background watermarks of broken streaks
      ctx.save();
      ctx.fillStyle = 'rgba(255, 80, 80, 0.08)';
      ctx.font = '800 120px "Plus Jakarta Sans"';
      ctx.textAlign = 'center';
      ctx.fillText("STREAK BROKEN", W/2, H/2 - 240);
      ctx.fillText("1 JUZ / DAY", W/2, H/2 + 340);
      ctx.restore();

      // Kinetic Typography Hook
      ctx.save();
      ctx.textAlign = 'center';

      // Line 1: "Why do Qur'an apps"
      const scale1 = 0.8 + 0.2 * ease;
      ctx.fillStyle = '#FFFFFF';

      ctx.shadowBlur = 20;

      // Line 2: "feel like homework?" (in gold/red contrast)
      if (st > 0.4) {

        ctx.font = `900 ${isVertical ? 74 : 62}px "Plus Jakarta Sans"`;
        ctx.fillText("feel like homework?", W/2, H/2);
      }

      if (st > 1.2) {

    // SCENE 2: The Reveal / Meet Wird
    function renderScene2(ctx, W, H, st) {
      const enterProgress = Math.min(st / 1.0, 1);
      const ease = easeOutCubic(enterProgress);

      // Golden light bloom sweep from center
      const bloom = ctx.createRadialGradient(W/2, H/2, 20, W/2, H/2, W * 0.7);
      bloom.addColorStop(0, 'rgba(212, 175, 55, 0.35)');
      bloom.addColorStop(0.4, 'rgba(16, 185, 129, 0.2)');
      bloom.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = bloom;
      ctx.fillRect(0, 0, W, H);

      // Islamic Rosette expansion in background
      const rosetteRadius = (isVertical ? 280 : 220) * (0.8 + 0.2 * ease);
      const rosetteRot = st * 0.15;
      drawIslamicRosette(ctx, W/2, H/2 - 120, rosetteRadius, 'rgba(212, 175, 55, 0.25)', 'rgba(18, 43, 32, 0.12)', rosetteRot);

      // 3D Phone swoops into view
      const phoneScale = (isVertical ? 1.05 : 0.75) * ease;
      const phoneY = H/2 + (1 - ease) * 350;

    function renderScene5(ctx, W, H, st) {

      const phoneScale = isVertical ? 1.05 : 0.8;

      ctx.fill();
      ctx.strokeStyle = 'rgba(16, 185, 129, 0.3)';
      ctx.stroke();

      ctx.font = `600 13px "Plus Jakarta Sans"`;
      ctx.fillText("Al-Falaq literally means 'the daybreak' or", -sheetW/2 + 44, -sheetH/2 + 198);
      ctx.fillText("cleaving of dawn. Seeking refuge in Allah.", -sheetW/2 + 44, -sheetH/2 + 224);

      // Bottom pause reassurance badge
      roundRect(ctx, -sheetW/2 + 28, -sheetH/2 + 268, sheetW - 56, 42, 12);

    // SCENE 6: Climax / Call to Action
    function renderScene6(ctx, W, H, st) {
      const ease = easeOutCubic(Math.min(st / 0.8, 1));

      // Golden Rosette halo expansion
      const haloRadius = (isVertical ? 380 : 300) * (0.8 + 0.2 * Math.sin(st));
      drawIslamicRosette(ctx, W/2, H/2 - 80, haloRadius, 'rgba(212, 175, 55, 0.35)', null, st * 0.1);

      // Centered Hero Phone
      const phoneScale = isVertical ? 0.95 : 0.72;
      draw3DPhone(ctx, W/2, H/2 + 40, phoneScale, 0.06, 0.0, 0, renderMosqueHomeScreen);

      // Big Climax Title
      ctx.save();
      ctx.textAlign = 'center';

      ctx.fillStyle = 'rgba(212, 175, 55, 0.9)';
      ctx.font = `800 ${isVertical ? 18 : 15}px "Plus Jakarta Sans"`;
      ctx.fillText("YOUR QUR'AN HABIT", W/2, isVertical ? 140 : 65);

      ctx.fillStyle = '#FFFFFF';
      ctx.font = `900 ${isVertical ? 64 : 48}px "Plus Jakarta Sans"`;
      ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
      ctx.shadowBlur = 24;
      ctx.fillText("Rebuilt for Real Life.", W/2, isVertical ? 210 : 120);

      // Call to action button
      const btnW = isVertical ? 340 : 280;
      const btnH = isVertical ? 64 : 52;
      const btnY = isVertical ? H - 180 : H - 90;

      ctx.translate(W/2, btnY);
      roundRect(ctx, -btnW/2, -btnH/2, btnW, btnH, 18);
      const ctaGrad = ctx.createLinearGradient(-btnW/2, -btnH/2, btnW/2, btnH/2);
      ctaGrad.addColorStop(0, '#F5E08C');
      ctaGrad.addColorStop(1, '#D4AF37');

      ctx.shadowColor = 'rgba(212, 175, 55, 0.6)';
      ctx.shadowBlur = 28;
      ctx.fill();

      ctx.fillStyle = '#07130D';
      ctx.font = `800 ${isVertical ? 18 : 16}px "Plus Jakarta Sans"`;
      ctx.fillText("Download Wird Free", 0, isVertical ? 6 : 5);

      ctx.shadowBlur = 0;
      ctx.fillStyle = 'rgba(255, 255, 255, 0.7)';
      ctx.font = `600 ${isVertical ? 14 : 12}px "Plus Jakarta Sans"`;

    // UI Updates (Timecode, Scrubber, Scene highlights)
    function updateUI() {
      // Timecode
      const mins = Math.floor(currentTime / 60);
      const secs = Math.floor(currentTime % 60);
      const ms = Math.floor((currentTime % 1) * 100);
      timecodeDisplay.textContent = `${String(mins).padStart(2,'0')}:${String(secs).padStart(2,'0')}.${String(ms).padStart(2,'0')}`;

      // Scrubber fill
      const progressPercent = (currentTime / TOTAL_DURATION_SEC) * 100;
      scrubberFill.style.width = `${progressPercent}%`;

      // Active scene pill
      const currentScene = SCENES.find(s => currentTime >= s.start && currentTime < s.end) || SCENES[SCENES.length - 1];
      scenePills.forEach(pill => {
        if (parseInt(pill.dataset.scene) === currentScene.id) {
          pill.classList.add('active');
        } else {
          pill.classList.remove('active');
        }
      });
    }

    function updatePlayIcon() {
      if (isPlaying) {
        playIcon.innerHTML = `<rect x="6" y="4" width="4" height="16"></rect><rect x="14" y="4" width="4" height="16"></rect>`;
      } else {
        playIcon.innerHTML = `<polygon points="5 3 19 12 5 21 5 3"></polygon>`;
      }
    }

    // Event Listeners
    btnPlayPause.addEventListener('click', () => {
      isPlaying = !isPlaying;
      updatePlayIcon();
      if (isPlaying && audioEnabled) initAudio();
    });

    btnRestart.addEventListener('click', () => {
      currentTime = 0;
      lastSoundScene = 0;
      isPlaying = true;
      updatePlayIcon();
    });

    btnLoopToggle.addEventListener('click', () => {
      isLooping = !isLooping;
      btnLoopToggle.style.color = isLooping ? 'var(--gold-bright)' : 'var(--text-muted)';
    });

    // Scrubber click / drag
    scrubberTrack.addEventListener('click', (e) => {
      const rect = scrubberTrack.getBoundingClientRect();
      const clickX = e.clientX - rect.left;
      const pct = Math.max(0, Math.min(1, clickX / rect.width));
      currentTime = pct * TOTAL_DURATION_SEC;
      lastSoundScene = 0;
    });

    // Scene jumper buttons
    scenePills.forEach(pill => {
      pill.addEventListener('click', () => {
        const sceneId = parseInt(pill.dataset.scene);
        const scene = SCENES.find(s => s.id === sceneId);
        if (scene) {
          currentTime = scene.start;
          lastSoundScene = 0;
        }
      });
    });

    // Aspect ratio toggle
    btnAspectVertical.addEventListener('click', () => {
      if (!isVertical) {
        isVertical = true;
        btnAspectVertical.classList.add('active');
        btnAspectHorizontal.classList.remove('active');
        viewportOuter.className = 'viewport-outer vertical';
        canvas.width = 1080;
        canvas.height = 1920;
      }
    });

    btnAspectHorizontal.addEventListener('click', () => {
      if (isVertical) {
        isVertical = false;
        btnAspectHorizontal.classList.add('active');
        btnAspectVertical.classList.remove('active');
        viewportOuter.className = 'viewport-outer horizontal';
        canvas.width = 1920;
        canvas.height = 1080;
      }
    });

    // Audio Mute/Unmute
    btnAudioToggle.addEventListener('click', () => {
      audioEnabled = !audioEnabled;
      btnAudioToggle.classList.toggle('muted', !audioEnabled);
      if (audioEnabled) initAudio();
    });

    // Live In-Browser Video Export (MediaRecorder)
    btnExport.addEventListener('click', () => {
      if (isRecording) {
        stopRecording();
      } else {
        startRecording();
      }
    });

    function startRecording() {
      initAudio();
      recordedChunks = [];
      currentTime = 0;
      lastSoundScene = 0;
      isPlaying = true;
      updatePlayIcon();

      const stream = canvas.captureStream(60);

      // Connect Web Audio stream if available
      if (audioCtx && audioEnabled) {
        try {
          const dest = audioCtx.createMediaStreamDestination();
          // Mix audio destination into stream
          const audioTrack = dest.stream.getAudioTracks()[0];
          if (audioTrack) stream.addTrack(audioTrack);
        } catch(e) {
          console.warn("Audio stream capture not supported, continuing with video only:", e);
        }
      }

      const options = { mimeType: 'video/webm;codecs=vp9' };
      try {
        mediaRecorder = new MediaRecorder(stream, options);
      } catch (e) {
        mediaRecorder = new MediaRecorder(stream);
      }

      mediaRecorder.ondataavailable = (e) => {
        if (e.data.size > 0) recordedChunks.push(e.data);
      };

      mediaRecorder.onstop = () => {
        const blob = new Blob(recordedChunks, { type: 'video/webm' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `wird_promo_${isVertical ? 'vertical_9x16' : 'widescreen_16x9'}.webm`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);

        btnExport.classList.remove('recording');
        exportText.textContent = "Export 60fps Video";
        isRecording = false;
      };

      mediaRecorder.start();
      isRecording = true;
      btnExport.classList.add('recording');
      exportText.textContent = "Recording Commercial...";

      // Automatically stop at end of duration
      setTimeout(() => {
        if (isRecording) stopRecording();
      }, (TOTAL_DURATION_SEC + 0.5) * 1000);
    }

    function stopRecording() {
      if (mediaRecorder && mediaRecorder.state !== 'inactive') {
        mediaRecorder.stop();
      }
    }

    // Start playback
    requestAnimationFrame(render);
  </script>
